# ============================================================================
# Fund Analyser — Milvus + Embedding Service（部署在 GPU 机器上）
# ============================================================================
# 启动:  docker compose up -d
# 停止:  docker compose down
# 清理:  docker compose down -v  (删除所有数据卷!)
#
# 前置条件:
#   1. 宿主机上存在 embedding_model 目录（bge-m3 + bge-reranker-v2-m3 ~4GB）
#   2. 宿主机上存在 sql-docker/.env 中配置的 PostgreSQL/MySQL/Redis
# ============================================================================

services:
  # ------------------------------------------------------------------
  # etcd — Milvus 元数据存储
  # ------------------------------------------------------------------
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ------------------------------------------------------------------
  # MinIO — Milvus 对象存储
  # ------------------------------------------------------------------
  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ------------------------------------------------------------------
  # Milvus — 向量数据库
  # ------------------------------------------------------------------
  milvus-standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.5.9
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19595:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"

  # ------------------------------------------------------------------
  # Attu — Milvus 可视化管理界面
  # ------------------------------------------------------------------
  attu:
    image: zilliz/attu:latest
    container_name: attu
    ports:
      - "8000:3000"
    environment:
      - MILVUS_URL=milvus-standalone:19530
    depends_on:
      - "milvus-standalone"

  # ------------------------------------------------------------------
  # Embedding Service — BGE-M3 + BGE-Reranker-v2-m3 一体化查询服务
  # ------------------------------------------------------------------
  embedding-service:
    build: .
    container_name: embedding-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      # 模型挂载（~4GB，太大不适合打入镜像）
      - ${EMBEDDING_MODEL_DIR:-../embedding_model}:/app/embedding_model:ro
      # 代码挂载（修改后只需 docker compose restart，无需重新 build）
      - ./embedding_service.py:/app/embedding_service.py:ro
      - ./hybrid_search.py:/app/hybrid_search.py:ro
    environment:
      - MILVUS_URL=http://milvus-standalone:19530
      - GPU_CONCURRENCY=${GPU_CONCURRENCY:-1}
      - BATCH_RERANK_WAIT_MS=${BATCH_RERANK_WAIT_MS:-50}
      - BATCH_RERANK_MAX=${BATCH_RERANK_MAX:-128}
      - EMBEDDING_MODEL_PATH=/app/embedding_model/bge-m3
      - RERANKER_MODEL_PATH=/app/embedding_model/bge-reranker-v2-m3
    ulimits:
      memlock: -1
    ipc: host
    depends_on:
      milvus-standalone:
        condition: service_healthy
    # GPU 支持
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

networks:
  default:
    name: milvus
