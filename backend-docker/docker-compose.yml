# ============================================================================
# Fund Analyser — Backend（FastAPI + Celery Workers）
# ============================================================================
# 启动:
#   docker compose up -d                    # API + 1 worker
#   docker compose up -d --scale worker=4   # API + 4 workers（多用户并发）
# 停止:
#   docker compose down
# ============================================================================

x-backend-env: &backend-env
  # ── GPU / Embedding Service（milvus-docker）──
  - GPU_HOST=embedding-service
  - GPU_PORT=8001
  # ── 数据库（sql-docker 服务名）──
  - POSTGRES_HOST=postgres
  - MYSQL_HOST=mysql
  - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-skc393720}
  - REDIS_URL=redis://redis:6379/0
  # ── Celery ──
  - CELERY_BROKER_URL=redis://redis:6379/1
  - CELERY_RESULT_BACKEND=redis://redis:6379/2
  # ── LLM API Key ──
  - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
  # ── JWT ──
  - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-change-me}
  # ── CORS ──
  - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
  # ── 其他 ──
  - LLM_MAX_CONCURRENCY=${LLM_MAX_CONCURRENCY:-10}
  - MCP_ENABLED=${MCP_ENABLED:-true}

x-backend-volumes: &backend-volumes
  - ../backend:/app:ro
  - backend_logs:/app/logs
  # 匿名卷：防止宿主机目录覆盖容器内构建的 node_modules
  - /app/mcp/cn-funds-mcp-master/node_modules

services:
  # ------------------------------------------------------------------
  # API Server — FastAPI（单实例）
  # ------------------------------------------------------------------
  backend:
    build: .
    container_name: fund-backend
    restart: unless-stopped
    ports:
      - "8800:8800"
    volumes: *backend-volumes
    environment: *backend-env
    command: python -m app.main
    networks:
      - default
      - milvus

  # ------------------------------------------------------------------
  # Worker — Celery solo（可横向扩展）
  #   每个 worker = 独立进程 = 自己的 MCP + rag-mcp + stdio 管道
  #   多 worker 间真正并发，无 MCP 串行瓶颈
  # ------------------------------------------------------------------
  worker:
    build: .
    restart: unless-stopped
    volumes: *backend-volumes
    environment: *backend-env
    command: >
      celery -A app.core.celery_app worker
      --pool=solo
      -Q agent_queue
      --hostname=worker@%h
      --loglevel=info
    networks:
      - default
      - milvus

volumes:
  backend_logs:

networks:
  default:
    external: true
    name: sql-docker_default
  milvus:
    external: true
    name: milvus
