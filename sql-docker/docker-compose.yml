# ============================================================================
# Fund Analyser — Docker Compose（部署在 GPU 机器 SKC 上）
# ============================================================================
# 启动:  docker compose up -d
# 停止:  docker compose down
# 清理:  docker compose down -v  (删除所有数据卷!)
#
# 注意: 如果 SKC 上已有独立部署的 PostgreSQL，请先停掉旧实例避免端口冲突，
#        然后注释掉下面的 postgres 服务（数据会丢失!确认后再操作）。
# ============================================================================

services:
  # ------------------------------------------------------------------
  # PostgreSQL — LangGraph checkpoint 存储
  # ------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: fund_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fund_user
      POSTGRES_PASSWORD: fund_pass
      POSTGRES_DB: fund_chat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fund_user -d fund_chat"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # MySQL — 业务数据（用户、会话索引、合规审计）
  # ------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: fund_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-skc393720}
      MYSQL_DATABASE: fund_analyser
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # Redis — 缓存 / 限流 / 分布式锁
  # ------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: fund_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# ============================================================================
volumes:
  postgres_data:
  mysql_data:
  redis_data:
